name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          semver = re.compile(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v") or semver.fullmatch(tag[1:]) is None:
              sys.exit(f"Invalid SemVer release tag: {tag}")

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"], text=True
          ))
          member_ids = set(metadata["workspace_members"])
          packages = [p for p in metadata["packages"] if p["id"] in member_ids]
          versions = {p["version"] for p in packages}
          if not packages or len(versions) != 1:
              sys.exit("Workspace packages do not share one release version")

          expected = f"v{versions.pop()}"
          if tag != expected:
              sys.exit(f"Tag {tag} does not match workspace version {expected}")
          print(f"Validated release tag {tag}")
          PY
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Check CLI help
        run: cargo run -p tuilane -- --help
      - name: Check CLI version
        run: cargo run -p tuilane -- --version
      - name: Check terminal restoration
        run: |
          cargo build -p tuilane --locked
          python3 scripts/check-terminal-lifecycle.py target/debug/tuilane
      - name: Check release archive reproducibility and clean install
        run: |
          set -euo pipefail
          artifacts=$(mktemp -d)
          trap 'rm -rf -- "$artifacts"' EXIT
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          SOURCE_DATE_EPOCH="$source_date_epoch" \
            scripts/package-release.sh x86_64-unknown-linux-gnu target/debug/tuilane "$artifacts/first"
          SOURCE_DATE_EPOCH="$source_date_epoch" \
            scripts/package-release.sh x86_64-unknown-linux-gnu target/debug/tuilane "$artifacts/second"
          cmp "$artifacts/first"/*.tar.gz "$artifacts/second"/*.tar.gz
          cmp "$artifacts/first"/*.sha256 "$artifacts/second"/*.sha256
          scripts/check-release-package.sh "$artifacts/first"/*.tar.gz

  runtime-evaluation:
    name: External Wasm runtime and plugin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: cachix/install-nix-action@v31
      - name: Validate the Wasm runtime experiment
        run: nix develop .#runtime-evaluation -c scripts/check-runtime-evaluation.sh
      - name: Validate the external plugin SDK
        run: nix develop .#runtime-evaluation -c scripts/check-plugin-sdk.sh

  nix-package:
    name: Nix package (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and install the Nix package
        env:
          PACKAGE_ATTR: .#packages.${{ matrix.system }}.tuilane
        run: |
          nix build --no-link "$PACKAGE_ATTR"
          profile="$RUNNER_TEMP/tuilane-profile"
          nix profile add --profile "$profile" "$PACKAGE_ATTR"
          "$profile/bin/tuilane" --version

  release-artifact:
    name: Linux release archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - workspace
      - runtime-evaluation
      - nix-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Find the previous version tag
        id: previous
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Build previous version for upgrade validation
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          previous_source="$RUNNER_TEMP/tuilane-previous"
          mkdir -p "$previous_source"
          git archive "$PREVIOUS_TAG" | tar -x -C "$previous_source"
          CARGO_TARGET_DIR="$RUNNER_TEMP/tuilane-previous-target" \
            cargo build --manifest-path "$previous_source/Cargo.toml" \
              --package tuilane --release --locked
      - name: Build release binary
        run: cargo build --package tuilane --release --locked
      - name: Package and validate release archive
        run: |
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          SOURCE_DATE_EPOCH="$source_date_epoch" \
            scripts/package-release.sh x86_64-unknown-linux-gnu \
              target/release/tuilane dist
          scripts/check-release-package.sh dist/*.tar.gz
      - name: Verify upgrade preserves user data
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          scripts/check-release-upgrade.sh \
            "$RUNNER_TEMP/tuilane-previous-target/release/tuilane" \
            target/release/tuilane
      - uses: actions/upload-artifact@v4
        with:
          name: tuilane-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
