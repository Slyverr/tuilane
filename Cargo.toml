[workspace]
resolver = "3"
members = [
    "crates/tuilane",
    "crates/tuilane-core",
    "crates/tuilane-ui",
    "crates/tuilane-storage",
    "crates/tuilane-plugin-api",
    "plugins/tasks",
    "plugins/calendar",
    "plugins/projects",
    "plugins/notes",
    "plugins/ideas",
    "plugins/links",
    "plugins/search",
]
default-members = ["crates/tuilane"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
[workspace.dependencies.directories]
version = "6.0.0"

[workspace.dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["clock", "std"]

[workspace.dependencies.crossterm]
version = "0.29.0"

[workspace.dependencies.clap]
version = "4.6.7"
default-features = false
features = ["std", "help", "usage", "error-context", "suggestions", "derive"]

[workspace.dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

[workspace.dependencies.rusqlite]
version = "0.42.0"
default-features = false
features = ["backup", "bundled"]

[workspace.dependencies.serde]
version = "1.0.229"
features = ["derive"]

[workspace.dependencies.toml]
version = "1.2.1"

[workspace.dependencies.tuilane-core]
path = "crates/tuilane-core"

[workspace.dependencies.tuilane-plugin-api]
path = "crates/tuilane-plugin-api"

[workspace.dependencies.tuilane-storage]
path = "crates/tuilane-storage"

[workspace.dependencies.tuilane-ui]
path = "crates/tuilane-ui"

[workspace.dependencies.tuilane-tasks]
path = "plugins/tasks"

[workspace.dependencies.tuilane-calendar]
path = "plugins/calendar"

[workspace.dependencies.tuilane-projects]
path = "plugins/projects"

[workspace.dependencies.tuilane-notes]
path = "plugins/notes"

[workspace.dependencies.tuilane-ideas]
path = "plugins/ideas"

[workspace.dependencies.tuilane-links]
path = "plugins/links"

[workspace.dependencies.tuilane-search]
path = "plugins/search"

[workspace.dependencies.uuid]
version = "1.29.0"
features = ["v4"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
